<header class="h-16 bg-white border-b border-gray-200 px-4 lg:px-6 flex items-center justify-between flex-shrink-0 relative">
  <div>
    <div class="text-[10px] uppercase tracking-[0.16em] text-gray-400 font-bold">{{ store.activeProduct().name }}</div>
    <div class="text-sm font-bold text-gray-900">Priority Decision Room</div>
  </div>

  <div class="flex items-center gap-2">
    <button (click)="toggleNotifications()" class="relative w-9 h-9 rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-50 flex items-center justify-center" aria-label="Notifications">
      <svg class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      @if (unreadCount() > 0) { <span class="absolute -top-1 -right-1 min-w-4 h-4 px-1 rounded-full bg-red-500 text-white text-[8px] font-black flex items-center justify-center">{{ unreadCount() }}</span> }
    </button>
  </div>

  @if (store.showNotificationPanel()) {
    <div class="absolute top-14 right-4 z-50 w-80 bg-white rounded-xl border border-gray-200 shadow-xl overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
        <div><div class="text-sm font-bold text-gray-900">Notifications</div><div class="text-[10px] text-gray-400">Priority signals & dependencies</div></div>
        <button (click)="markAllRead()" class="text-[10px] font-bold text-bca-primary">Mark all read</button>
      </div>
      <div class="divide-y divide-gray-100">
        @for (notification of store.notifications(); track notification.id) {
          <a [routerLink]="notification.actionUrl ?? '/dashboard'" (click)="markRead(notification.id)" class="block px-4 py-3 hover:bg-gray-50" [class.bg-blue-50]="!notification.isRead">
            <div class="flex items-start gap-3"><span class="mt-1 w-2 h-2 rounded-full" [class]="notification.isRead ? 'bg-gray-200' : 'bg-bca-primary'"></span><div><div class="text-xs font-bold text-gray-800">{{ notification.title }}</div><p class="text-[10px] text-gray-500 mt-1 leading-relaxed">{{ notification.body }}</p></div></div>
          </a>
        }
      </div>
    </div>
  }
</header>
